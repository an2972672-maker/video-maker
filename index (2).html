<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script to Video</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151c;--panel:#18202b;--ink:#eef2f6;--mute:#8fa0b3;--acc:#3ddc97;--line:#2a3646}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;padding:16px}
main{max-width:980px;margin:0 auto;display:grid;gap:14px}
h1{font-size:22px;margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:grid;gap:4px;color:var(--mute);font-size:14px}
input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%}
textarea{min-height:140px;resize:vertical}
button{background:var(--acc);color:#04251a;border:0;border-radius:8px;padding:12px 18px;font:600 16px Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
canvas{max-width:100%;max-height:70vh;background:#000;border-radius:10px;border:1px solid var(--line);margin:0 auto;display:block}
#log{color:var(--mute);font-size:14px;min-height:22px;white-space:pre-line}
details{color:var(--mute);font-size:14px}
a.dl{color:var(--acc);font-weight:600}
</style></head><body><main>
<h1>Script to Video</h1>
<div class="row">
 <label>Topic (English, for images)<input id="topic" placeholder="e.g. Apollo 11 moon landing"></label>
 <label>Language<select id="lang"><option value="ur">اردو Urdu</option><option value="en">English</option></select></label>
 <label>Ratio<select id="ratio"><option value="16:9">16:9 YouTube / Facebook</option><option value="9:16">9:16 TikTok / Reels / Shorts</option><option value="1:1">1:1 Square</option><option value="4:5">4:5 Facebook feed</option></select></label>
 <label>Quality<select id="q"><option value="720">HD 720p</option><option value="1080">Full HD 1080p</option></select></label>
 <label>Image style<select id="style">
  <option value="cinematic, dramatic lighting, photorealistic">Cinematic</option>
  <option value="flat cartoon illustration, bright colors">Cartoon</option>
  <option value="anime style, detailed background">Anime</option>
  <option value="watercolor painting, soft colors">Watercolor</option>
  <option value="3d render, pixar style">3D</option></select></label>
 <label>Voice speed<select id="rate"><option value="0.9">Slow</option><option value="1" selected>Normal</option><option value="1.15">Fast</option></select></label>
</div>
<label>Script (one sentence = one scene)<textarea id="script"></textarea></label>
<details><summary>Advanced: voice server and backup images</summary>
 <div class="row" style="margin-top:8px">
  <label>Voice server URL (Cloudflare Worker, see worker.js)<input id="vurl" placeholder="https://your-worker.workers.dev"></label>
  <label>Pexels API key (backup images, optional)<input id="pkey"></label>
 </div>
 <p>Without a voice server, the browser voice is used and you must share this tab with audio when asked (PC Chrome only).</p>
</details>
<div><button id="go">Generate video</button></div>
<div id="log" role="status"></div>
<canvas id="cv" width="1280" height="720"></canvas>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let W=1280,H=720,msgs=[];
const log=t=>$('log').textContent=t;
$('vurl').value=localStorage.getItem('vurl')||'';$('pkey').value=localStorage.getItem('pkey')||'';
let voices=[];const loadV=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=loadV;loadV();

function setSize(){
  const [a,b]=$('ratio').value.split(':').map(Number),s=+$('q').value;
  if(a>=b){H=s;W=Math.round(s*a/b/2)*2}else{W=s;H=Math.round(s*b/a/2)*2}
  cv.width=W;cv.height=H;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
}
$('ratio').onchange=$('q').onchange=setSize;setSize();

const split=t=>t.split(/(?<=[.!?۔؟])\s+|\n+/).map(s=>s.trim()).filter(Boolean);

async function imgPollinations(p,seed){
  const k=Math.min(1,1280/Math.max(W,H));
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=${Math.round(W*k)}&height=${Math.round(H*k)}&nologo=true&seed=${seed}`;
  for(let i=0;i<3;i++){
    try{const r=await fetch(url);if(!r.ok)throw 0;return await createImageBitmap(await r.blob())}catch(e){await sleep(1500)}
  }return null;
}
async function imgPexels(q,key){
  try{
    const o=H>W?'portrait':'landscape';
    const r=await fetch(`https://api.pexels.com/v1/search?per_page=1&orientation=${o}&query=${encodeURIComponent(q)}`,{headers:{Authorization:key}});
    const j=await r.json();const u=j.photos&&j.photos[0]&&j.photos[0].src.large;if(!u)return null;
    return await createImageBitmap(await (await fetch(u)).blob());
  }catch(e){return null}
}

function chunks(t,n=180){
  const out=[];let cur='';
  for(const w of t.split(/\s+/)){if((cur+' '+w).length>n&&cur){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}
  if(cur)out.push(cur);return out;
}
async function tts(text,lang,base,ac){
  const bufs=[];
  for(const c of chunks(text)){
    const r=await fetch(`${base.replace(/\/$/,'')}/?l=${lang}&q=${encodeURIComponent(c)}`);
    if(!r.ok)throw new Error('voice server '+r.status);
    bufs.push(await ac.decodeAudioData(await r.arrayBuffer()));
  }return bufs;
}

function wrap(text,maxW){
  const lines=[];let cur='';
  for(const w of text.split(/\s+/)){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
function draw(sc,t,alpha,rtl){
  ctx.globalAlpha=alpha;
  if(sc.img){
    const z=1+0.08*Math.min(t/6,1),s=Math.max(W/sc.img.width,H/sc.img.height)*z,w=sc.img.width*s,h=sc.img.height*s;
    ctx.drawImage(sc.img,(W-w)/2,(H-h)/2,w,h);
  }else{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1d2b3a');g.addColorStop(1,'#0e5a45');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const fs=Math.round(Math.min(W,H)*(rtl?0.062:0.055));
  ctx.font=rtl?`600 ${fs}px "Noto Naskh Arabic",serif`:`600 ${fs}px Inter,sans-serif`;
  ctx.direction=rtl?'rtl':'ltr';ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=wrap(sc.text,W*0.86),lh=fs*(rtl?1.6:1.35),bottom=H*(H>W?0.16:0.07),y0=H-bottom-lh*lines.length;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W*0.04,y0-fs*0.3,W*0.92,lh*lines.length+fs*0.5);
  ctx.fillStyle='#fff';lines.forEach((l,i)=>ctx.fillText(l,W/2,y0+lh*i+lh/2));
  ctx.globalAlpha=1;
}
function speakBrowser(text,lang,rate){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);u.lang=lang==='ur'?'ur-PK':'en-US';u.rate=rate;
    const v=voices.find(v=>v.lang.toLowerCase().startsWith(lang));if(v){u.voice=v;u.lang=v.lang}
    let d=false;const f=()=>{if(!d){d=true;res()}};u.onend=f;u.onerror=f;
    setTimeout(f,Math.max(3000,text.length*90)*3);speechSynthesis.speak(u);
  });
}

$('go').onclick=async()=>{
  const text=$('script').value.trim();if(!text){log('Paste a script first.');return}
  localStorage.setItem('vurl',$('vurl').value);localStorage.setItem('pkey',$('pkey').value);
  const lang=$('lang').value,rtl=lang==='ur',topic=$('topic').value.trim()||'story',base=$('vurl').value.trim(),pkey=$('pkey').value.trim(),rate=+$('rate').value;
  setSize();$('go').disabled=true;$('out').innerHTML='';
  await document.fonts.load('600 40px "Noto Naskh Arabic"').catch(()=>{});
  const sents=split(text),scenes=[],fails=[];
  const ac=new (window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination();
  for(let i=0;i<sents.length;i++){
    log(`Scene ${i+1} of ${sents.length}: making image…`);
    let img=await imgPollinations(`${topic}, ${$('style').value}${lang==='en'?', '+sents[i]:''}`,i+7);
    if(!img&&pkey)img=await imgPexels(topic,pkey);
    if(!img)fails.push(i+1);
    let bufs=null;
    if(base){
      log(`Scene ${i+1} of ${sents.length}: making voice…`);
      try{bufs=await tts(sents[i],lang,base,ac)}catch(e){log('Voice server failed: '+e.message);$('go').disabled=false;return}
    }
    scenes.push({text:sents[i],img,bufs});
  }
  const stream=cv.captureStream(30);let dispStream=null;
  if(base){stream.addTrack(dest.stream.getAudioTracks()[0])}
  else{
    try{dispStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,preferCurrentTab:true});
      const a=dispStream.getAudioTracks()[0];if(a)stream.addTrack(a)}catch(e){}
  }
  const mimes=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m)),ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const parts=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:H>=1080||W>=1080?8e6:5e6});
  rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  const stopped=new Promise(r=>rec.onstop=r);rec.start();
  let cur=0,prev=null,t0=performance.now(),tf=-1,run=true;
  (function loop(){
    if(!run)return;const n=performance.now(),t=(n-t0)/1000,f=tf<0?1:Math.min((n-tf)/500,1);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    if(prev&&f<1)draw(prev.sc,prev.t,1,rtl);
    draw(scenes[cur],t,f,rtl);requestAnimationFrame(loop);
  })();
  for(let i=0;i<scenes.length;i++){
    log(`Recording scene ${i+1} of ${scenes.length}…`);
    if(i>0){prev={sc:scenes[cur],t:(performance.now()-t0)/1000};cur=i;t0=performance.now();tf=t0}
    const sc=scenes[i];
    if(sc.bufs){
      let at=ac.currentTime+0.05;
      for(const b of sc.bufs){const s=ac.createBufferSource();s.buffer=b;s.playbackRate.value=rate;s.connect(dest);s.connect(ac.destination);s.start(at);at+=b.duration/rate}
      await sleep((at-ac.currentTime)*1000+400);
    }else{await speakBrowser(sc.text,lang,rate);await sleep(400)}
  }
  run=false;rec.stop();await stopped;
  if(dispStream)dispStream.getTracks().forEach(t=>t.stop());
  const url=URL.createObjectURL(new Blob(parts,{type:mime.split(';')[0]}));
  $('out').innerHTML=`<video src="${url}" controls style="max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:10px"></video><p><a class="dl" href="${url}" download="video.${ext}">Download video (.${ext})</a></p>`;
  log(fails.length?`Done. Images failed for scenes: ${fails.join(', ')} (gradient used). Check your connection or add a Pexels key.`:'Done.');
  $('go').disabled=false;
};
</script></body></html>
